      <path fill="var(--paper)" d="m24 37 7-3 9 5-4 18 21 31c-13 5-29 6-43 1l13-32z"/>
      <path d="m27 30 1 5m6-5 1 5m-8 22 9 0m-7 7-7 21m13-19 11 18"/>
