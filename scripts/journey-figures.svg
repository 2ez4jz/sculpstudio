      <path fill="var(--paper)" d="m23 43 8-5 7 6 0 16-5 6 12 19c-9 5-18 6-27 2l4-22 4-11z"/>
      <path d="m28 34 1 5m5-5 0 6m-9 22 9 1m-7 6-3 15m9-13 5 11"/>
      <g data-motion="nod-right" data-pivot="31 30"><use href="#journey-bride-head" transform="translate(31 27) rotate(17)"/></g>
      <path d="m24 45-5 13 15 6"/>
      <g data-motion="reach" data-pivot="36 45"><path d="m36 45 7 11 12 1m-1 0 3-2"/></g>
      <path fill="var(--paper)" d="M40 60c0-5 43-5 43 0s-43 6-43 0z"/>
      <path d="M61 64v26m-10 2h20"/>
      <g data-motion="calendar" data-pivot="60 59">
        <path fill="var(--paper)" d="m47 42 22-2 2 18-22 2z"/>
        <path d="m48 47 22-2m-17-5v5m11-6v5m-12 8 3-.3m6-.6 3-.3m-11 5 3-.3m6-.6 3-.3"/>
      </g>
      <g data-motion="point" data-pivot="98 42"><path d="m98 42-10 13-18-3m0 0-4-2"/></g>
    </symbol>
    <symbol id="couple-trial" viewBox="0 0 120 100">
