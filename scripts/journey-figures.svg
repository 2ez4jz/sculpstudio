      <path d="m43 25 1 6m5-5 1 6m-11 6-8 12 8 6"/>
      <use href="#journey-bride-head" transform="translate(46 19) rotate(8)"/>
      <g data-motion="joined-hands" data-pivot="63 48"><path d="m55 37 5 11 7 1m12-15-7 13-5 2"/></g>
      <g data-motion="wave" data-pivot="94 35"><path d="m94 35 9 12 6-9m0 0 1-4"/></g>
      <path d="m34 51-4-8m7 9 0-10m-2 10-8-6"/>
      <circle cx="29" cy="41" r="3.3" fill="var(--paper)"/><circle cx="37" cy="40" r="3.5" fill="var(--paper)"/><circle cx="25" cy="45" r="3" fill="var(--paper)"/>
    </symbol>
  </defs>
</svg>
