<svg xmlns="http://www.w3.org/2000/svg" class="journey-art-library" aria-hidden="true" width="0" height="0">
  <defs>
    <!-- Shared faces keep the identity; each scene has its own body and gesture. -->
    <g id="journey-bride-head">
      <ellipse cy="1" rx="5.8" ry="7.2" fill="var(--sand)"/>
      <path fill="var(--ink)" d="M-5.8 2c-3-8 2-13 8-10 5 1 6 6 3 10L3-5C1-1-3-1-5.8 2z"/>
      <circle cx="-7" cy="-3" r="3.2" fill="var(--ink)"/>
      <path d="m4 2 1.5 1-1.5 1"/>
    </g>
    <g id="journey-groom-head">
      <ellipse cy="1" rx="6" ry="7.3" fill="var(--sand)"/>
      <path fill="var(--ink)" d="M-6 2c-3-9 2-13 9-10 4 2 5 6 2 10L3-5C0-2-3-4-6 2z"/>
      <path d="m-5 1-1.5 2L-5 4"/>
    </g>
    <symbol id="couple-enquiry" viewBox="0 0 120 100">
