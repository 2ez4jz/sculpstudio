      <path d="M18 48v23h23m-21 0-2 21m20-21 3 21"/>
      <path fill="var(--ink)" d="m87 61-3 30h6l5-25 3 25h6l-2-30z"/>
      <path d="M83 93h8m6 0h9"/>
      <path fill="var(--ink)" d="m87 31 8-2 9 5-3 30-15 1-3-19z"/>
      <path fill="var(--paper)" d="m91 30 3 18 5-18-4 3z"/>
      <path stroke="var(--paper)" d="m87 35 2 8-3 3 6 11"/>
      <path d="m92 24 0 7m6-7 0 7"/>
      <g data-motion="nod-left" data-pivot="96 22"><use href="#journey-groom-head" transform="translate(96 19) rotate(-10)"/></g>
      <path fill="var(--paper)" d="m28 42 8-4 8 5-2 19 11 11 11 15c-13 5-29 5-43 0l1-23 8-11z"/>
      <path d="m32 34 1 5m5-5 0 5m-8 23 12 0m-8 8-4 15m11-13 12 13"/>
      <g data-motion="nod-right" data-pivot="36 30"><use href="#journey-bride-head" transform="translate(36 27) rotate(4)"/></g>
      <path d="m28 44-3 14 15 5m61-28 9 19-12 9"/>
