        <path d="M38 20c17 2 31 15 35 35l10 28M42 30l12 51"/>
      </g>
      <path fill="var(--ink)" d="m84 63-11 17 7 12 5-2-4-10 12-12 3 11 9 13 4-3-7-14-1-16z"/>
      <path fill="var(--ink)" d="m78 35 9-2 14 9-3 23-18-2-6-15z"/>
      <path fill="var(--paper)" d="m80 34 4 16 7-13-7 1z"/>
      <path stroke="var(--paper)" d="m78 39 2 7-2 4 6 8"/>
      <path d="m78 27 3 8m5-9 1 8"/>
