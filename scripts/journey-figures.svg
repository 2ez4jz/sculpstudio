      <g data-motion="bride-step" data-pivot="48 67"><path d="m48 67-9 15-3 10m-4 0h7"/></g>
      <path d="m54 69 8 14 9 6m-1 3 5-3"/>
      <g data-motion="groom-step" data-pivot="86 57"><path fill="var(--ink)" d="m83 56-10 21-16 12 3 4 20-12 11-21z"/><path d="m55 91 5 4"/></g>
      <path fill="var(--ink)" d="m87 55 12 18 10 13-4 4-13-14-12-16z"/>
      <path d="m105 91 6-4"/>
      <path fill="var(--ink)" d="m80 29 7-2 9 5-3 28-17-2 0-18z"/>
      <path fill="var(--paper)" d="m83 28 3 17 6-16-5 2z"/>
      <path stroke="var(--paper)" d="m80 33 2 7-3 3 5 9"/>
      <path d="m84 22 0 7m5-6 0 6"/>
      <use href="#journey-groom-head" transform="translate(88 17) rotate(9)"/>
      <g data-motion="skirt" data-pivot="49 48"><path fill="var(--paper)" d="M42 49c-9 14-15 26-30 35 18 5 37 8 55 2L55 49z"/><path d="M43 59 27 81m25-19 6 21"/></g>
